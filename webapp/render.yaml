# Render Blueprint for GeM Price Comparison
# Deploy with: render blueprint apply render.yaml

services:
  # Backend API Service
  - type: web
    name: gem-price-backend
    runtime: docker
    dockerfilePath: ./web app/backend/Dockerfile
    dockerContext: ./web app/backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gem-postgres
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: gem-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: SCRAPER_RATE_LIMIT
        value: "2.0"
      - key: SCRAPER_MAX_PAGES
        value: "15"
    healthCheckPath: /health
    autoDeploy: true
    plan: starter

  # Frontend Service
  - type: web
    name: gem-price-frontend
    runtime: docker
    dockerfilePath: ./webapp/frontend/Dockerfile
    dockerContext: ../webapp/frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://gem-price-backend.onrender.com
    autoDeploy: true
    plan: starter

  # PostgreSQL Database
  - type: pserv
    name: gem-postgres
    plan: starter
    ipAllowList: []
    databases:
      - name: gem_price
        user: gem

  # Redis Cache
  - type: redis
    name: gem-redis
    plan: starter
    ipAllowList: []