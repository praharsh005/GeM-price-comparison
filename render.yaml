# Render Blueprint for GeM Price Comparison

services:

  # ============================================================
  # BACKEND API - FREE WEB SERVICE
  # ============================================================
  - type: web
    name: gem-price-backend
    runtime: docker
    plan: free

    dockerfilePath: ./webapp/backend/Dockerfile
    dockerContext: ./webapp/backend

    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gem-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: gem-redis
          type: keyvalue
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

      - key: SCRAPER_RATE_LIMIT
        value: "2.0"

      - key: SCRAPER_MAX_PAGES
        value: "15"

      - key: ALLOWED_ORIGINS
        sync: false


  # ============================================================
  # FRONTEND - FREE STATIC SITE
  # ============================================================
  - type: web
    name: gem-price-frontend
    runtime: static

    buildCommand: cd webapp/frontend && npm ci && npm run build
    staticPublishPath: ./webapp/frontend/dist

    autoDeploy: true

    envVars:
      - key: VITE_API_BASE_URL
        sync: false


  # ============================================================
  # REDIS-COMPATIBLE KEY VALUE - FREE
  # ============================================================
  - type: keyvalue
    name: gem-redis
    plan: free

    ipAllowList: []


# ==============================================================
# POSTGRESQL - FREE
# ==============================================================
databases:

  - name: gem-postgres
    plan: free
    databaseName: gem_price
    user: gem