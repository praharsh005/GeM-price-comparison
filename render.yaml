# Render Blueprint for GeM Price Comparison
# File location:
# C:\Users\maddu\Downloads\GeM-price-comparison\render.yaml

services:

  # ============================================================
  # BACKEND API
  # ============================================================
  - type: web
    name: gem-price-backend
    runtime: docker
    plan: starter

    dockerfilePath: ./webapp/backend/Dockerfile
    dockerContext: ./webapp/backend

    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gem-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: gem-redis
          type: keyvalue
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

      - key: SCRAPER_RATE_LIMIT
        value: "2.0"

      - key: SCRAPER_MAX_PAGES
        value: "15"

      - key: ALLOWED_ORIGINS
        sync: false


  # ============================================================
  # FRONTEND
  # ============================================================
  - type: web
    name: gem-price-frontend
    runtime: docker
    plan: starter

    dockerfilePath: ./webapp/frontend/Dockerfile
    dockerContext: ./webapp/frontend

    autoDeploy: true

    envVars:
      - key: VITE_API_BASE_URL
        sync: false


  # ============================================================
  # POSTGRESQL DATABASE
  # ============================================================
  - type: pserv
    name: gem-postgres
    plan: starter

    ipAllowList: []

    databases:
      - name: gem_price
        user: gem


  # ============================================================
  # REDIS-COMPATIBLE KEY VALUE
  # ============================================================
  - type: keyvalue
    name: gem-redis
    plan: starter

    ipAllowList: []